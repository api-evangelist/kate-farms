  flows:
  - authorizationCode
  sources:
  - well-known/kate-farms-openid-configuration.json
- scope: 'customer-account-mcp-api:full'
  description: Full access to the Customer Account MCP API — the agent-facing projection
    of the shopper's account, which is what lets an enrolled agent act on a Kate Farms
    customer's behalf.
  flows:
  - authorizationCode
  sources:
  - well-known/kate-farms-openid-configuration.json
notes:
- Only four scopes are advertised, and two of them are coarse ":full" grants. There
  is no read-only variant of either the Customer Account API or the Customer Account
  MCP API on this discovery document, so an agent acting for a shopper is granted
  the whole account surface or nothing.
- These are the shopper-identity scopes. Anonymous storefront reads (catalog, collections,
  search, blog, pages) need no scope at all.
