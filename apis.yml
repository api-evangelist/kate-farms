    url: https://shopify.dev/docs/api/storefront
    x-note: Platform reference published by Shopify, not by Kate Farms; it is the reference
      a developer uses to call this host.
- name: Kate Farms UCP Agentic Commerce (MCP)
  description: 'Kate Farms'' storefront advertises the Universal Commerce Protocol
    (UCP) at /.well-known/ucp and exposes an MCP endpoint for agent-driven commerce
    — catalog search and lookup, cart, discount, fulfillment, checkout and order capabilities,
    with Google Pay, Shopify Card and Shop Pay payment handlers. tools/list is gated:
    the server requires a resolvable UCP agent profile URI and returns JSON-RPC error
    -32001 invalid_profile_url to anonymous callers, so tool input schemas require
    an enrolled agent profile.'
  humanURL: https://shop.katefarms.com/llms.txt
  baseURL: https://shop.katefarms.com/api/ucp/mcp
