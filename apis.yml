aid: kate-farms
name: Kate Farms
description: 'Kate Farms is a Santa Barbara, California nutrition company that makes
  USDA-certified-organic, plant-based (organic yellow pea protein) medical nutrition
  formulas and shakes for tube feeding and oral supplemental nutrition, used in more
  than 1,400 hospitals and prescribed across pediatric and adult care. The company
  sells direct to consumers through a Shopify storefront at shop.katefarms.com and
  publishes clinical and reimbursement material for healthcare professionals at katefarmsmedical.com.
  Its public machine-readable surface is commerce-side rather than a developer product:
  the storefront exposes an anonymous-introspectable Shopify Storefront GraphQL API,
  an agent-facing llms.txt / agents.md, and a live Universal Commerce Protocol (UCP)
  merchant profile with an MCP endpoint for agent-driven catalog search, cart and
  checkout.'
