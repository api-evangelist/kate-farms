apis:
- name: Kate Farms Storefront GraphQL API
  description: 'The Shopify Storefront GraphQL API as deployed on Kate Farms'' own
    host. Anonymous introspection succeeded on 2026-08-04, returning 424 types, 35
    root query fields and 41 mutations covering products, collections, search, predictive
    search, blogs/articles, pages, metaobjects, cart lifecycle, customer accounts and
    Shop Pay payment request sessions. The schema is the Shopify platform contract;
    the data and the endpoint are Kate Farms''.'
  humanURL: https://shop.katefarms.com/agents.md
  baseURL: https://shop.katefarms.com/api/2026-01/graphql.json
